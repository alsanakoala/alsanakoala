<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Serhat Hançer — Software Engineer</title>
  <desc id="desc">Dark profile banner featuring Serhat Hançer, backend systems, full-stack products and document intelligence.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#11152b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1264" height="384" rx="28" fill="url(#background)" stroke="#1e293b" stroke-width="2"/>
  <rect x="9" y="9" width="1262" height="382" rx="27" fill="url(#grid)"/>
  <ellipse cx="205" cy="70" rx="330" ry="230" fill="url(#glowA)"/>
  <ellipse cx="1110" cy="345" rx="370" ry="255" fill="url(#glowB)"/>

  <g opacity="0.45">
    <path d="M 615 76 C 694 76, 698 118, 756 118" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="615" cy="76" r="4" fill="#22d3ee"/>
    <circle cx="756" cy="118" r="4" fill="#22d3ee"/>
    <path d="M 580 293 C 664 293, 683 248, 754 248" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="580" cy="293" r="4" fill="#a78bfa"/>
    <circle cx="754" cy="248" r="4" fill="#a78bfa"/>
    <path d="M 670 184 L 744 184" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 7"/>
  </g>

  <g transform="translate(66 42)">
    <rect width="246" height="30" rx="15" fill="#0f2435" stroke="#164e63"/>
    <circle cx="18" cy="15" r="4" fill="#22d3ee" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="0.6">github.com/alsanakoala</text>
  </g>

  <g transform="translate(68 104)">
    <rect width="56" height="56" rx="16" fill="#0f2538" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="28" y="37" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">SH</text>
  </g>

  <text x="68" y="214" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="750" letter-spacing="1.5">SERHAT HANÇER</text>
  <rect x="68" y="233" width="510" height="4" rx="2" fill="url(#accent)"/>
  <text x="68" y="273" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="5">SOFTWARE ENGINEER</text>
  <text x="68" y="306" fill="#64748b" font-family="Consolas, Menlo, monospace" font-size="15" letter-spacing="1.1">BACKEND SYSTEMS  /  FULL-STACK PRODUCTS  /  DOCUMENT INTELLIGENCE</text>

  <g transform="translate(68 331)">
    <rect width="152" height="34" rx="17" fill="#0f2538" stroke="#164e63"/>
    <circle cx="18" cy="17" r="4" fill="#22d3ee"/>
    <text x="31" y="22" fill="#bae6fd" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="0.5">PUBLIC SYSTEMS</text>
  </g>
  <g transform="translate(230 331)">
    <rect width="132" height="34" rx="17" fill="#151b35" stroke="#4c1d95"/>
    <circle cx="18" cy="17" r="4" fill="#a78bfa"/>
    <text x="31" y="22" fill="#ddd6fe" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="0.5">APPLIED NLP</text>
  </g>
  <g transform="translate(372 331)">
    <rect width="186" height="34" rx="17" fill="#10222a" stroke="#115e59"/>
    <circle cx="18" cy="17" r="4" fill="#2dd4bf"/>
    <text x="31" y="22" fill="#ccfbf1" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="0.5">QUALITY ENGINEERING</text>
  </g>

  <g transform="translate(778 61)">
    <rect width="430" height="278" rx="20" fill="#08101c" stroke="#273449" stroke-width="1.5"/>
    <rect x="1" y="1" width="428" height="46" rx="19" fill="#0d1726"/>
    <path d="M 1 46 H 429" stroke="#1e293b"/>
    <circle cx="25" cy="24" r="5" fill="#fb7185"/>
    <circle cx="44" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="63" cy="24" r="5" fill="#34d399"/>
    <text x="215" y="29" text-anchor="middle" fill="#64748b" font-family="Consolas, Menlo, monospace" font-size="12">serhat@engineering:~</text>

    <text x="28" y="85" fill="#22d3ee" font-family="Consolas, Menlo, monospace" font-size="15">$ profile --status</text>
    <text x="28" y="112" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="15">&gt; building dependable systems</text>

    <text x="28" y="151" fill="#a78bfa" font-family="Consolas, Menlo, monospace" font-size="15">$ stack --primary</text>
    <text x="28" y="178" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="15">&gt; java · spring · react · typescript</text>
    <text x="28" y="205" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="15">&gt; postgres · docker · automated tests</text>

    <text x="28" y="244" fill="#2dd4bf" font-family="Consolas, Menlo, monospace" font-size="15">$ next --ship</text>
    <rect x="28" y="257" width="10" height="18" rx="1" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="1210" y="368" text-anchor="end" fill="#334155" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">ENGINEERING PROFILE / 2026</text>
</svg>
